source_id: "finance/fdic"
display_name: "FDIC Active Banks"
entity_type: "company"
data_as_of: "2026-01-30"

start_urls:
  - "https://api.fdic.gov/banks/institutions"

run_command: "npx tsx scraper.ts"

refresh: "monthly"

primary_key_strategy:
  type: "stable_id"
  stable_id_context_path: ["cert"]

expected_volume_range:
  min: 4000
  max: 5000

notes: |
  Fetches all FDIC-insured active banks from the public FDIC API.
  Merges institution data with latest financial reports.
  CERT number is the stable unique identifier.
  Assets are reported in thousands.
