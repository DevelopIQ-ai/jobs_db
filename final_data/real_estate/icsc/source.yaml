source_id: "real_estate/icsc"
display_name: "ICSC Members (Owner/Developer)"
entity_type: "person"
data_as_of: "2026-01-30"

start_urls:
  - "https://www.icsc.com/members"

run_command: "npx tsx scraper.ts"
refresh: "monthly"

primary_key_strategy:
  type: "stable_id"
  stable_id_context_path:
    - "context"
    - "profile_id"

expected_volume_range:
  min: 5000
  max: 15000

requires_login: true

notes: |
  Requires ICSC member login. Scrapes Owner/Developer member profiles.
  Credentials should be set in .env.local file.
