"notes": "Scrapes SEC EDGAR for public companies with real estate SIC codes:

  - 6500-6553: Real Estate (operators, agents, REITs, developers)

  - 6798: Real Estate Investment Trusts

  - 1520-1542: General Building Contractors

  - 1531: Operative Builders

  Uses browse-edgar Atom feed to collect CIKs by SIC code,

  then data.sec.gov/submissions API for full company details.

  SEC requires User-Agent header. Rate limited to 8 req/sec.\n"
